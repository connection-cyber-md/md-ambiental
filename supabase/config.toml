# Configuração do Supabase CLI para o stack local (Docker). Não afeta
# nenhum projeto hospedado — só é usada por `supabase start`/`db reset`.
# project_id é só um identificador local para os containers Docker.
project_id = "md-ambiental-staging"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Peça crítica: sem este hook, as claims tenant_id/role nunca chegam ao JWT
# e toda política de RLS (ver supabase/migrations/0003_helper_functions.sql)
# nega acesso por padrão. Ver supabase/migrations/0014_custom_access_token_hook.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "50MiB"
